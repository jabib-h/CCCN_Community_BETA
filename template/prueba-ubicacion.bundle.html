<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prueba de Ubicación | CCCN</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
.quiz-page { background: var(--cream); min-height: calc(100vh - 200px); padding: clamp(40px, 6vw, 64px) 0 80px; }

.qcard {
  max-width: 760px; margin: 0 auto;
  background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.qcard__top {
  padding: 24px 32px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
}
.qcard__counter { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.qcard__counter strong { color: var(--cccn-blue-900); font-size: 15px; }

.qcard__progress {
  height: 4px; background: var(--line);
  width: 100%;
}
.qcard__progress span { display: block; height: 100%; background: var(--cccn-red); transition: width .3s ease; border-radius: 0 2px 2px 0; }

.qcard__body { padding: clamp(32px, 5vw, 56px); }
.qcard__cefr {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--cccn-blue-100); color: var(--cccn-blue-700);
  padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
}
.qcard__question {
  font-family: var(--font-sans); font-weight: 500;
  font-size: clamp(22px, 2.6vw, 32px); line-height: 1.2;
  color: var(--cccn-blue-900); margin: 16px 0 8px;
  letter-spacing: -.01em;
}
.qcard__prompt {
  font-style: normal; font-family: var(--font-sans); font-weight: 400;
  color: var(--muted); font-size: 16px; margin: 0 0 28px;
}
.qcard__sentence {
  background: var(--cream); border-radius: 12px;
  padding: 20px 24px;
  font-size: 18px; color: var(--cccn-blue-900);
  font-family: var(--font-sans); font-weight: 500;
  line-height: 1.45;
  margin-bottom: 24px;
}
.qcard__blank {
  display: inline-block; min-width: 90px;
  border-bottom: 2px solid var(--cccn-red);
  padding: 0 8px;
  text-align: center;
  font-weight: 600;
}

.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  font: inherit;
  transition: border-color .12s ease, background .12s ease, transform .12s ease;
}
.opt:hover { border-color: var(--cccn-blue-500); background: var(--cccn-blue-100); }
.opt.is-selected { border-color: var(--cccn-blue-700); background: var(--cccn-blue-100); }
.opt.is-correct { border-color: #1F8A5B; background: #E6F4EA; }
.opt.is-wrong { border-color: var(--cccn-red); background: var(--cccn-red-100); }
.opt__letter {
  width: 32px; height: 32px; border-radius: 999px;
  background: var(--cccn-blue-100); color: var(--cccn-blue-700);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.opt.is-selected .opt__letter, .opt.is-correct .opt__letter { background: #1F8A5B; color: #fff; }
.opt.is-wrong .opt__letter { background: var(--cccn-red); color: #fff; }
.opt__text { flex: 1; color: var(--ink); font-size: 16px; font-weight: 500; }

.qcard__foot {
  padding: 20px 32px; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
  background: var(--tint);
}

.qcard__skip { color: var(--muted); font-size: 14px; }
.qcard__skip button { background: none; border: none; color: var(--cccn-blue-700); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }

/* Start screen */
.qstart { max-width: 760px; margin: 0 auto; text-align: center; padding: clamp(32px, 5vw, 56px); }
.qstart h1 { font-family: var(--font-sans); font-weight: 400; font-size: clamp(40px, 5.5vw, 64px); line-height: 1; letter-spacing: -.02em; color: var(--cccn-blue-900); margin: 0; }
.qstart h1 em { font-weight: 700; color: var(--cccn-red); }
.qstart .lede { margin: 20px auto 32px; }
.qstart__meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; }
@media (max-width: 600px) { .qstart__meta { grid-template-columns: 1fr; } }
.qstart__meta div {
  background: #fff; border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 16px; text-align: left;
  display: flex; gap: 12px; align-items: center;
}
.qstart__meta strong { display: block; color: var(--cccn-blue-900); font-size: 15px; }
.qstart__meta span { color: var(--muted); font-size: 13px; }
.qstart__meta svg { color: var(--cccn-red); flex-shrink: 0; }

/* Result */
.qresult {
  max-width: 820px; margin: 0 auto;
  background: #fff; border-radius: var(--r-lg);
  border: 1px solid var(--line);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.qresult__top {
  background: linear-gradient(135deg, var(--cccn-blue-900), var(--cccn-blue-700));
  color: #fff;
  padding: clamp(32px, 5vw, 56px);
  text-align: center;
}
.qresult__big {
  font-family: var(--font-sans); font-weight: 400;
  font-size: clamp(80px, 11vw, 120px);
  line-height: 1; letter-spacing: -.03em;
  margin: 12px 0;
}
.qresult__big em { font-weight: 700; color: var(--cccn-red); }
.qresult__label { font-family: var(--font-sans); font-style: normal; font-size: clamp(20px, 2.2vw, 26px); color: var(--cccn-red); }
.qresult__score { color: rgba(255,255,255,.7); font-size: 14px; letter-spacing: .04em; margin-top: 8px; }

.qresult__body { padding: clamp(32px, 5vw, 48px); }
.qresult__lede { font-family: var(--font-sans); font-size: 22px; line-height: 1.3; color: var(--cccn-blue-900); margin: 0 0 24px; max-width: 50ch; }

.qresult__bands { display: grid; gap: 4px; margin: 24px 0 32px; }
.qresult__band {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 8px;
  font-size: 14px;
  background: var(--tint);
  color: var(--muted);
}
.qresult__band.is-here { background: var(--cccn-red); color: #fff; font-weight: 600; }
.qresult__band.is-here strong { color: var(--cccn-red); }
.qresult__band strong { color: var(--cccn-blue-900); font-weight: 700; width: 50px; }

.qresult__cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }

@keyframes celebrate {
  0% { transform: scale(.5); opacity: 0; }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
.qresult__big { animation: celebrate .8s ease-out; }
</style>
</head>
<body>
<div data-site-header></div>

<main class="quiz-page">
  <div class="container">
    <div id="app"></div>
  </div>
</main>

<div data-site-footer></div>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
